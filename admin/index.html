<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Let's See — responses</title>
<style>
  body{margin:0;background:#f6f1e7;color:#2b2b2b;font:16px/1.5 Georgia,serif}
  main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
  h1{font-weight:500;margin:0 0 4px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}
  button{font:14px system-ui,sans-serif;border:1px solid #2b2b2b;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer}
  button:hover{background:#2b2b2b;color:#f6f1e7}
  article{background:#fffdf8;border:1px solid #d9d0bd;padding:18px 20px;margin-bottom:18px;border-radius:4px}
  article h2{font-size:16px;margin:0 0 10px;font-weight:600}
  dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:6px 14px}
  dt{font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#777;padding-top:3px}
  dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .tag{display:inline-block;background:#e9dfc8;padding:1px 8px;border-radius:99px;font:12px system-ui,sans-serif;margin-left:8px}
  @media(max-width:520px){dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Responses</h1>
  <div id="count" style="color:#777"></div>
  <div class="bar">
    <button id="copyAll">Copy all</button>
    <button id="dlJson">Export JSON</button>
    <button id="refresh">Refresh</button>
  </div>
  <div id="list"></div>
</main>
<script src="/admin/admin.js"></script>
</body>
</html>
